version: '3.8'

services:
  db:
    image: postgres:16
    container_name: notekeeper_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-notekeeper}
      - POSTGRES_USER=${POSTGRES_USER:-notekeeper}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-notekeeper}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notekeeper}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: notekeeper_app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
