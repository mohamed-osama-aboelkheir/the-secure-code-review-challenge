<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller & Random Word Selector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .section {
            margin-bottom: 40px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-right: 10px;
            margin-top: 10px;
            width: 100px;
        }

        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 10px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .dice-result {
            font-size: 3em;
            text-align: center;
            margin: 20px 0;
        }

        .word-list {
            margin-top: 15px;
            padding: 10px;
            background: white;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
        }

        .word-item {
            padding: 5px;
            margin: 5px 0;
            border-bottom: 1px solid #eee;
        }

        .selected-word {
            background: #fff3cd;
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 Dice Roller & Random Word Selector</h1>

        <div class="section">
            <h2>Roll Single Dice</h2>
            <button onclick="rollSingleDice()">Roll Dice</button>
            <div id="singleDiceResult" class="result" style="display: none;"></div>
        </div>

        <div class="section">
            <h2>Roll Multiple Dices</h2>
            <input type="number" id="diceCount" min="1" max="10" value="2" placeholder="Number of dices">
            <button onclick="rollMultipleDices()">Roll Dices</button>
            <div id="multipleDiceResult" class="result" style="display: none;"></div>
        </div>

        <div class="section">
            <h2>Random Word Selector</h2>
            <p>Enter words (one per line or comma-separated):</p>
            <textarea id="wordsInput" placeholder="apple, banana, cherry
or one word per line"></textarea>
            <button onclick="selectRandomWord()">Select Random Word</button>
            <div id="wordResult" class="result" style="display: none;"></div>
        </div>
    </div>

    <script>
        async function rollSingleDice() {
            try {
                const response = await fetch('/api/roll-dice');
                const data = await response.json();
                const resultDiv = document.getElementById('singleDiceResult');
                resultDiv.innerHTML = `<div class="dice-result">${data.result}</div>`;
                resultDiv.style.display = 'block';
            } catch (error) {
                alert('Error rolling dice: ' + error.message);
            }
        }

        async function rollMultipleDices() {
            try {
                const count = parseInt(document.getElementById('diceCount').value) || 1;
                const response = await fetch('/api/roll-dices', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ count })
                });
                const data = await response.json();
                const resultDiv = document.getElementById('multipleDiceResult');
                resultDiv.innerHTML = `<div>Results: ${data.results.join(', ')}</div><div style="margin-top: 10px;">Total: ${data.results.reduce((a, b) => a + b, 0)}</div>`;
                resultDiv.style.display = 'block';
            } catch (error) {
                alert('Error rolling dices: ' + error.message);
            }
        }

        async function selectRandomWord(wordsFromUrl = null) {
            try {
                let words;
                
                if (wordsFromUrl) {
                    // Use words from URL query parameter
                    words = wordsFromUrl;
                } else {
                    // Get words from textarea input
                    const input = document.getElementById('wordsInput').value;
                    if (!input.trim()) {
                        alert('Please enter some words');
                        return;
                    }

                    // Parse input - support both comma-separated and newline-separated
                    words = input.split(/[,\n]/)
                        .map(w => w.trim())
                        .filter(w => w.length > 0);
                }

                const response = await fetch('/api/random-word', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ words })
                });

                const data = await response.json();
                const resultDiv = document.getElementById('wordResult');
                
                let html = `<div class="selected-word">Selected: ${data.selectedWord}</div>`;
                html += `<div class="word-list">All words (${data.originalCount}):`;
                data.allWords.forEach((word, index) => {
                    html += `<div class="word-item">${index + 1}. ${word}</div>`;
                });
                html += '</div>';
                
                resultDiv.innerHTML = html;
                resultDiv.style.display = 'block';
            } catch (error) {
                alert('Error selecting word: ' + error.message);
            }
        }

        // Handle query parameters on page load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const wordsParam = urlParams.get('words');
            
            if (wordsParam) {
                // Decode and populate the textarea
                const decodedWords = decodeURIComponent(wordsParam);
                document.getElementById('wordsInput').value = decodedWords;
                
                // Parse words and automatically select random word
                const words = decodedWords.split(',')
                    .map(w => w.trim())
                    .filter(w => w.length > 0);
                
                if (words.length > 0) {
                    selectRandomWord(words);
                }
            }
        });
    </script>
</body>
</html>
